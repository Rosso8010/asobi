<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;touch-action:none;background:#fdf6e3;
 font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif}
button{font-family:inherit;cursor:pointer}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column}
.screen.active{display:flex}
/* ---- home ---- */
#scr-home{background:linear-gradient(160deg,#ffe082,#ffab91);align-items:center;justify-content:center;gap:18px}
.home-title{font-size:44px;color:#5d4037;font-weight:bold;text-shadow:0 3px 0 rgba(255,255,255,.8)}
.home-sub{font-size:19px;color:#6d4c37;font-weight:bold}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:640px;max-width:92%}
.home-card{border:none;border-radius:26px;padding:24px 10px;font-size:25px;font-weight:bold;color:#fff;
 box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:6px}
.home-card .big{font-size:54px;line-height:1.1}
.home-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
/* ---- common ---- */
.topbar{min-height:58px;display:flex;align-items:center;gap:10px;padding:6px 10px;flex-wrap:wrap;
 background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:5}
.homebtn{font-size:24px;background:#ffd54f;border:none;border-radius:14px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.homebtn:active{transform:translateY(2px);box-shadow:none}
.ttl{font-size:21px;font-weight:bold;color:#4e4237}
.spacer{flex:1}
.actbtn{border:none;border-radius:13px;padding:8px 13px;font-size:15px;font-weight:bold;background:#eceff1;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.actbtn:active{transform:translateY(2px);box-shadow:none}
.stage{flex:1;position:relative;overflow:hidden}
canvas.fill{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.toolrow{display:flex;flex-wrap:wrap;gap:7px;padding:7px 9px;background:#fff;align-items:center;box-shadow:0 -2px 6px rgba(0,0,0,.06);z-index:5}
.tbtn{border:none;border-radius:14px;padding:6px 10px;font-size:13px;font-weight:bold;color:#555;background:#f1f3f4;
 box-shadow:0 3px 0 rgba(0,0,0,.10);display:flex;flex-direction:column;align-items:center;min-width:62px;line-height:1.2}
.tbtn .ico{font-size:23px}
.tbtn.sel{background:#ffd54f;color:#5d4037;outline:3px solid #ffa000}
.hidden{display:none!important}
/* ---- kazu ---- */
.kz-total{font-size:19px;color:#555;font-weight:bold}
#kz-num{font-size:30px;color:#e65100;padding:0 4px}
.expr{color:#8d6e63;font-size:15px;font-weight:bold}
.quizbtn{border:none;border-radius:14px;padding:9px 14px;font-size:16px;font-weight:bold;background:#ce93d8;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.target{font-size:20px;color:#7b1fa2;font-weight:bold;min-width:10px}
/* ---- koro ---- */
.stars{font-size:21px;font-weight:bold;color:#f57f17}
.stagerow{display:flex;gap:7px;padding:6px 9px;background:#eef7fd;overflow-x:auto;align-items:center;z-index:4}
.stagechip{border:none;border-radius:12px;padding:8px 13px;font-size:14px;font-weight:bold;background:#fff;color:#456;box-shadow:0 2px 0 rgba(0,0,0,.1);white-space:nowrap}
.stagechip.sel{background:#ffd54f;outline:3px solid #ffa000;color:#5d4037}
/* ---- oekaki ---- */
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.swatch.sel{outline:4px solid #ff9800}
.szbtn{width:44px;height:44px;border-radius:12px;border:none;background:#f1f3f4;box-shadow:0 2px 0 rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}

#oe-drawer{position:absolute;left:12px;right:12px;top:8px;background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25);
 padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:2px;max-height:72%;overflow-y:auto;touch-action:pan-y;z-index:10}
#oe-drawer button{font-size:33px;background:none;border:none;padding:5px;border-radius:10px}

.uta-sec{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 8px rgba(0,0,0,.07)}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#rec-state{font-size:17px;color:#444;font-weight:bold}

.fxbtn{border:none;border-radius:14px;padding:7px 12px;font-size:13px;font-weight:bold;color:#4a3760;background:#f3e5f5;
 box-shadow:0 3px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;min-width:70px;line-height:1.25}

<script>
'use strict';
/* ================= utils ================= */
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rr(ctx,x,y,w,h,r){ // rounded rect path (Safari15 has no ctx.roundRect)
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ================= audio ================= */
var AC=null;
function ac(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext; AC=new C();}
  if(AC.state==='suspended'){AC.resume();}
  return AC;
}
function tone(f1,f2,dur,type,vol,when){
  try{
    var c=ac(),o=c.createOscillator(),g=c.createGain();
    o.type=type;
    var t=when||c.currentTime;
    o.frequency.setValueAtTime(f1,t);
    if(f2){o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+dur);}
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.03));
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sfx(n){
  try{
    var c=ac();
    if(n==='click'){tone(520,0,0.06,'square',0.07);}
    else if(n==='pop'){tone(420,880,0.09,'sine',0.2);}
    else if(n==='drop'){tone(340,160,0.12,'sine',0.2);}
    else if(n==='no'){tone(220,140,0.18,'square',0.1);}
    else if(n==='tak'){tone(190,120,0.05,'triangle',0.09);}
    else if(n==='boing'){tone(120,480,0.16,'sine',0.2);}
    else if(n==='star'){tone(1319,1760,0.12,'sine',0.14);}
    else if(n==='yay'){
      var fs=[523,659,784,1047];
      for(var i=0;i<fs.length;i++){tone(fs[i],0,0.18,'triangle',0.18,c.currentTime+i*0.09);}
    }
  }catch(e){}
}
var lastTak=0;
function sfxThrottle(n){var now=Date.now(); if(now-lastTak>90){lastTak=now; sfx(n);}}

/* ================= confetti ================= */
var CONF=(function(){
  var cv=$('#fx-cv'),ctx=cv.getContext('2d'),ps=[],dirty=false;
  var COLS=['#f44336','#ff9800','#ffeb3b','#4caf50','#29b6f6','#ab47bc','#ec407a'];
  function size(){cv.width=window.innerWidth; cv.height=window.innerHeight;}
  size(); window.addEventListener('resize',size);
  function burst(x,y,n){
    for(var i=0;i<n;i++){
      ps.push({x:x,y:y,vx:(Math.random()-0.5)*560,vy:-Math.random()*560-140,
        rot:Math.random()*6.3,vr:(Math.random()-0.5)*14,life:0.9+Math.random()*0.8,
        c:COLS[(Math.random()*COLS.length)|0],s:6+Math.random()*8});
    }
  }
  function tick(dt){
    if(!ps.length){ if(dirty){ctx.clearRect(0,0,cv.width,cv.height); dirty=false;} return; }
    dirty=true;
    ctx.clearRect(0,0,cv.width,cv.height);
    var alive=[];
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.vy+=950*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.life-=dt;
      if(p.life>0 && p.y<cv.height+40){
        alive.push(p);
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.globalAlpha=Math.min(1,p.life*2);
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.7);
        ctx.restore();
      }
    }
    ps=alive;
  }
  return {burst:burst,tick:tick};
})();

/* ================= screens ================= */
var cur='home';
var hooks={};
function show(name){
  var el=document.getElementById('scr-'+cur);
  if(el)el.classList.remove('active');
  cur=name;
  document.getElementById('scr-'+cur).classList.add('active');
  if(hooks[name]&&hooks[name].enter)hooks[name].enter();
}
$$('[data-go]').forEach(function(b){
  b.addEventListener('click',function(){sfx('click'); show(b.dataset.go);});
});

/* ================= かずブロック ================= */
var KZ=(function(){
  var stage=$('#kazu-stage'),cv=$('#kazu-cv'),ctx=cv.getContext('2d');
  var SIZES=[1,2,3,4,5,10];
  var COL={1:'#ef5350',2:'#ffa726',3:'#fdd835',4:'#66bb6a',5:'#42a5f5',10:'#ab47bc'};
  var TXT={1:'#fff',2:'#fff',3:'#7a6408',4:'#fff',5:'#fff',10:'#fff'};
  var W=0,H=0,U=36,cols=20,rows=12,ox=20,floorY=0,palY=0,pal=[],blocks=[],drag=null,quiz=null,vertMode=false,confirmT=0;

  function activeSizes(){return quiz?quiz.subset:SIZES;}
  function bw(b){return b.vert?1:b.n;}
  function bh(b){return b.vert?b.n:1;}
  function colsOverlap(b,col,w){return b.col<col+w && col<b.col+bw(b);}
  function rectOverlap(b,col,row,w,h){
    return b.col<col+w && col<b.col+bw(b) && b.row<row+h && row<b.row+bh(b);
  }
  function resize(){
    W=stage.clientWidth; H=stage.clientHeight;
    if(!W||!H)return;
    var d=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*d; cv.height=H*d;
    ctx.setTransform(d,0,0,d,0,0);
    palY=H-96;
    U=clamp(Math.floor(Math.min((W-40)/20,(palY-64)/12)),22,46);
    cols=Math.floor((W-30)/U);
    rows=Math.floor((palY-56)/U);
    ox=Math.floor((W-cols*U)/2);
    floorY=palY-12;
    var sizes=activeSizes();
    var sumN=0;
    sizes.forEach(function(n){sumN+=n;});
    var ps=clamp(Math.floor((W-170-13*sizes.length)/sumN),8,30);
    var x=140;
    pal=sizes.map(function(n){
      var it={n:n,x:x,y:palY+28,w:n*ps,h:40};
      x+=n*ps+13;
      return it;
    });
    draw();
  }
  function restRow(col,w,arr){
    var r=0;
    for(var i=0;i<arr.length;i++){
      if(colsOverlap(arr[i],col,w))r=Math.max(r,arr[i].row+bh(arr[i]));
    }
    return r;
  }
  function settle(){
    blocks.sort(function(a,b){return a.row-b.row;});
    var done=[];
    for(var i=0;i<blocks.length;i++){
      blocks[i].row=restRow(blocks[i].col,bw(blocks[i]),done);
      done.push(blocks[i]);
    }
  }
  // 支えの位置がかたよっていたら倒れる (積み木の転倒)
  function supportedCols(b){
    var s=[];
    for(var c=b.col;c<b.col+bw(b);c++){
      for(var i=0;i<blocks.length;i++){
        var p=blocks[i];
        if(p===b)continue;
        if(p.col<=c&&c<p.col+bw(p)&&p.row<=b.row-1&&b.row-1<p.row+bh(p)){s.push(c); break;}
      }
    }
    return s;
  }
  function topple(){
    var guard=0,changed=true;
    while(changed&&guard++<25){
      changed=false;
      settle();
      for(var i=0;i<blocks.length;i++){
        var b=blocks[i];
        if(b.row===0||bw(b)<2)continue;
        var s=supportedCols(b);
        if(!s.length)continue;
        var center=b.col+(bw(b)-1)/2;
        var dir=0;
        if(Math.max.apply(null,s)<center-0.26)dir=1;
        else if(Math.min.apply(null,s)>center+0.26)dir=-1;
        if(!dir)continue;
        var nc=clamp(b.col+dir,0,cols-bw(b));
        if(nc===b.col)continue;
        var others=blocks.filter(function(p){return p!==b;});
        var nr=restRow(nc,bw(b),others);
        if(nr<b.row){ // より低くおちられるときだけ たおれる
          b.col=nc; b.row=nr;
          changed=true;
          sfxThrottle('tak');
          break;
        }
      }
    }
  }
  // 指の高さ(rowPtr)から落としたときの着地行。ひさしの下にも置ける
  function landAt(col,vert,n,rowPtr){
    var w=vert?1:n,h=vert?n:1;
    var lv=[0],i;
    for(i=0;i<blocks.length;i++){
      if(colsOverlap(blocks[i],col,w))lv.push(blocks[i].row+bh(blocks[i]));
    }
    function freeAt(r){
      if(r+h>rows)return false;
      for(var k=0;k<blocks.length;k++){
        if(rectOverlap(blocks[k],col,r,w,h))return false;
      }
      return true;
    }
    var best=-1,above=1e9;
    for(i=0;i<lv.length;i++){
      var r=lv[i];
      if(!freeAt(r))continue;
      if(r<=rowPtr){if(r>best)best=r;}
      else{if(r<above)above=r;}
    }
    if(best>=0)return best;
    if(above<1e9)return above;
    return -1;
  }
  function total(){var s=0;for(var i=0;i<blocks.length;i++)s+=blocks[i].n;return s;}
  function quizText(){
    if(!quiz)return '';
    var T=quiz.T,k=quiz.k;
    if(quiz.ctype==='exact')return '⭐ '+T+' を ちょうど'+k+'こで!';
    if(quiz.ctype==='max')return '⭐ '+T+' を '+k+'こまでで!';
    if(quiz.ctype==='min')return '⭐ '+T+' を '+k+'こいじょうで!';
    return '⭐ '+T+' を つくってね!';
  }
  function refresh(){
    var t=total(),cnt=blocks.length;
    $('#kz-num').textContent=t;
    var ns=blocks.map(function(b){return b.n;}).sort(function(a,b){return b-a;});
    var ex=(ns.length>1&&ns.length<=12)?'('+ns.join('+')+')':'';
    if(quiz&&cnt>0)ex+=' 【'+cnt+'こ】';
    $('#kz-expr').textContent=ex;
    if(quiz && t===quiz.T){
      var ok=quiz.ctype==='exact'?cnt===quiz.k:
             quiz.ctype==='max'?cnt<=quiz.k:
             quiz.ctype==='min'?cnt>=quiz.k:true;
      if(ok){
        quiz=null;
        $('#kz-target').textContent='🎉 せいかい! すごい!';
        sfx('yay');
        var r=cv.getBoundingClientRect();
        CONF.burst(r.left+W/2,r.top+H/2,90);
        setTimeout(function(){if(!quiz)$('#kz-target').textContent='';},3000);
        resize(); // パレットをもとにもどす
      }else{
        $('#kz-target').textContent='💡 かずは OK! こすうを みてね';
        sfx('tak');
        setTimeout(function(){if(quiz)$('#kz-target').textContent=quizText();},2200);
      }
    }
  }
  $('#kz-quiz').addEventListener('click',function(){
    sfx('click');
    var pools=[[1,2,3,4,5,10],[2,3,4,5],[2,3,4,5,10],[3,4,5],[1,2,3],[2,5,10]];
    var tries=0;
    do{
      var subset=pools[Math.floor(Math.random()*pools.length)];
      var k=2+Math.floor(Math.random()*3); // 2〜4こ
      var T=0;
      for(var i=0;i<k;i++)T+=subset[Math.floor(Math.random()*subset.length)];
      tries++;
    }while(T===total()&&tries<10);
    var ctype=['exact','max','min','free'][Math.floor(Math.random()*4)];
    quiz={T:T,k:k,ctype:ctype,subset:subset};
    $('#kz-target').textContent=quizText();
    resize(); // パレットを もんだいのブロックだけにする
  });
  $('#kz-rot').addEventListener('click',function(){
    sfx('click');
    vertMode=!vertMode;
    $('#kz-rot').textContent=vertMode?'↕ たて':'↔ よこ';
    draw();
  });
  var kzClear=$('#kz-clear');
  kzClear.addEventListener('click',function(){
    var now=Date.now();
    if(now-confirmT<2500){
      blocks=[]; confirmT=0;
      kzClear.textContent='🗑 リセット';
      sfx('pop'); refresh(); draw();
    }else{
      confirmT=now;
      kzClear.textContent='ほんとに?';
      setTimeout(function(){kzClear.textContent='🗑 リセット';},2500);
    }
  });
  function dropColOf(dg){
    var w=dg.vert?1:dg.n;
    return clamp(Math.round((dg.x-ox)/U-w/2),0,cols-w);
  }

  cv.addEventListener('pointerdown',function(e){
    if(drag&&Date.now()-(drag.tm||0)>1500)drag=null; // 迷子ドラッグの救済
    if(drag)return;
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(y>palY){
      for(var i=0;i<pal.length;i++){
        var it=pal[i];
        if(x>=it.x-8&&x<=it.x+it.w+8&&y>=it.y-12){
          drag={n:it.n,vert:(it.n>1&&vertMode),x:x,y:y,pid:e.pointerId,tm:Date.now()};
          sfx('pop'); break;
        }
      }
    }else{
      for(var j=blocks.length-1;j>=0;j--){
        var b=blocks[j];
        var bx=(b.px!==undefined)?b.px:ox+b.col*U;
        var by=(b.py!==undefined)?b.py:floorY-(b.row+bh(b))*U;
        if(x>=bx&&x<=bx+bw(b)*U&&y>=by&&y<=by+bh(b)*U){
          blocks.splice(j,1); settle(); topple(); refresh();
          drag={n:b.n,vert:b.vert,x:x,y:y,pid:e.pointerId,tm:Date.now(),
                fromBlock:true,oc:b.col,or:b.row,dispX:bx,dispY:by,sx:x,sy:y,t0:Date.now(),moved:false};
          sfx('pop'); break;
        }
      }
    }
    draw();
  });
  window.addEventListener('pointermove',function(e){
    if(cur!=='kazu'||!drag||e.pointerId!==drag.pid)return;
    var r=cv.getBoundingClientRect();
    drag.x=e.clientX-r.left; drag.y=e.clientY-r.top;
    drag.tm=Date.now();
    if(drag.fromBlock&&!drag.moved){
      var dx=drag.x-drag.sx,dy=drag.y-drag.sy;
      if(dx*dx+dy*dy>100)drag.moved=true;
    }
    draw();
  });
  function endDrag(e){
    if(cur!=='kazu'||!drag||e.pointerId!==drag.pid)return;
    var placed=false;
    if(drag.fromBlock&&!drag.moved&&Date.now()-drag.t0<600&&drag.n>1){
      // トンとたたいたら くるっと回転
      var nv=!drag.vert,w2=nv?1:drag.n;
      var c2=clamp(drag.oc,0,cols-w2);
      var row2=landAt(c2,nv,drag.n,Math.max(drag.or,0));
      if(row2>=0){
        blocks.push({n:drag.n,vert:nv,col:c2,row:row2,px:drag.dispX,py:drag.dispY,vy:0});
        sfx('pop'); placed=true;
      }else{
        blocks.push({n:drag.n,vert:drag.vert,col:drag.oc,row:drag.or,px:drag.dispX,py:drag.dispY,vy:0});
        sfx('no'); placed=true;
      }
    }
    if(!placed){
      if(drag.y<palY){
        var vert=drag.vert,w=vert?1:drag.n,h=vert?drag.n:1;
        var col=dropColOf(drag),rp=clamp(Math.floor((floorY-drag.y)/U),0,rows-1);
        var row=landAt(col,vert,drag.n,rp);
        if(row>=0){
          blocks.push({n:drag.n,vert:vert,col:col,row:row,px:drag.x-w*U/2,py:drag.y-h*U/2,vy:0});
          sfx('drop');
        }else{sfx('no');}
      }else{sfx('pop');}
    }
    drag=null; settle(); topple(); refresh(); draw();
  }
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);

  function drawBlock(x,y,n,vert,alpha){
    var w=(vert?1:n)*U,h=(vert?n:1)*U;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=COL[n];
    rr(ctx,x+1,y+1,w-2,h-2,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
    for(var i=1;i<n;i++){
      ctx.beginPath();
      if(vert){ctx.moveTo(x+4,y+i*U); ctx.lineTo(x+w-4,y+i*U);}
      else{ctx.moveTo(x+i*U,y+4); ctx.lineTo(x+i*U,y+h-4);}
      ctx.stroke();
    }
    rr(ctx,x+1,y+1,w-2,h-2,7); ctx.stroke();
    ctx.fillStyle=TXT[n];
    ctx.font='bold '+Math.min(U*0.52,20)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n,x+w/2,y+h/2+1);
    ctx.globalAlpha=1;
  }
  function drawPalBlock(it){ // パレットは常によこ向きの見本
    ctx.fillStyle=COL[it.n];
    rr(ctx,it.x+1,it.y+1,it.w-2,it.h-2,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2;
    var uw=it.w/it.n;
    for(var i=1;i<it.n;i++){
      ctx.beginPath(); ctx.moveTo(it.x+i*uw,it.y+4); ctx.lineTo(it.x+i*uw,it.y+it.h-4); ctx.stroke();
    }
    rr(ctx,it.x+1,it.y+1,it.w-2,it.h-2,7); ctx.stroke();
    ctx.fillStyle=TXT[it.n];
    ctx.font='bold 20px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.n,it.x+it.w/2,it.y+it.h/2+1);
  }
  function draw(){
    if(!W)return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fffde7'; ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='#f0e6c4'; ctx.lineWidth=1;
    var gy=floorY-rows*U;
    for(var c=0;c<=cols;c++){
      ctx.beginPath(); ctx.moveTo(ox+c*U,gy); ctx.lineTo(ox+c*U,floorY); ctx.stroke();
    }
    for(var r2=0;r2<=rows;r2++){
      ctx.beginPath(); ctx.moveTo(ox,floorY-r2*U); ctx.lineTo(ox+cols*U,floorY-r2*U); ctx.stroke();
    }
    // floor
    ctx.strokeStyle='#8d6e63'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(6,floorY+3); ctx.lineTo(W-6,floorY+3); ctx.stroke();
    // blocks (px,py = アニメーション中の表示位置)
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i];
      if(b.px===undefined)b.px=ox+b.col*U;
      if(b.py===undefined)b.py=floorY-(b.row+bh(b))*U;
      drawBlock(b.px,b.py,b.n,b.vert,1);
    }
    // palette strip
    ctx.fillStyle='#efe9dc';
    rr(ctx,6,palY+6,W-12,H-palY-12,16); ctx.fill();
    ctx.fillStyle='#a1887f';
    ctx.font='bold 14px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(quiz?'つかえるのは':'ここから',18,palY+38);
    ctx.fillText(quiz?'これだけ!':'ドラッグ→',18,palY+58);
    for(var k=0;k<pal.length;k++)drawPalBlock(pal[k]);
    // drag ghost
    if(drag){
      var w=(drag.vert?1:drag.n)*U,h=(drag.vert?drag.n:1)*U;
      if(drag.y<palY){
        var col=dropColOf(drag),rp=clamp(Math.floor((floorY-drag.y)/U),0,rows-1);
        var row=landAt(col,drag.vert,drag.n,rp);
        if(row>=0){
          ctx.setLineDash([7,7]); ctx.strokeStyle='#43a047'; ctx.lineWidth=3;
          ctx.strokeRect(ox+col*U,floorY-(row*U)-h,w,h);
          ctx.setLineDash([]);
        }
      }
      drawBlock(drag.x-w/2,drag.y-h/2,drag.n,drag.vert,0.8);
    }
  }
  // 落下(重力+バウンド)と 転倒の横すべり アニメーション
  function tick(dt){
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i];
      var tx=ox+b.col*U, ty=floorY-(b.row+bh(b))*U;
      if(b.px===undefined)b.px=tx;
      if(b.py===undefined){b.py=ty; b.vy=0;}
      if(Math.abs(b.px-tx)>0.5){b.px+=(tx-b.px)*Math.min(1,12*dt);}
      else{b.px=tx;}
      if(b.py>ty+0.5){b.py=ty; b.vy=0;}
      else if(b.py<ty-0.5||b.vy){
        b.vy=(b.vy||0)+2600*dt;
        b.py+=b.vy*dt;
        if(b.py>=ty){
          if(b.vy>380){b.py=ty; b.vy=-b.vy*0.16; sfxThrottle('tak');}
          else{b.py=ty; b.vy=0;}
        }
      }
    }
    draw();
  }
  return {resize:resize,tick:tick};
})();

      {t:'rampL',x:296,y:196},
      {t:'tramp',x:Math.min(W-320,430),y:FLOOR-26},
      {t:'goal', x:Math.min(W-120,620),y:FLOOR-58}
    ];
  }
  // toolbar
  var tl=$('#kr-tools'),toolBtns={};
  function setTool(id){
    tool=id;
    TOOLS.forEach(function(t){toolBtns[t.id].classList.toggle('sel',t.id===id);});
  }
  TOOLS.forEach(function(t){

    tl.appendChild(b);
  });
  function updateGoalTool(){
    toolBtns.goal.style.display=(mode<0)?'':'none';
    if(mode>=0&&tool==='goal')setTool('ball');
  }
  $('#kr-next').addEventListener('click',function(){
    sfx('click');
    $('#kr-ovl').classList.add('hidden');

  });
  $('#kr-stay').addEventListener('click',function(){
    sfx('click');
    $('#kr-ovl').classList.add('hidden');
  });
  $('#kr-reset').addEventListener('click',function(){sfx('pop'); balls=[];});
  var clearBtn=$('#kr-clear');
  clearBtn.addEventListener('click',function(){
    var now=Date.now();
    if(now-confirmT<2500){
      if(mode>=0){parts=parts.filter(function(p){return p.locked;});}
      else{parts=[];}
      balls=[]; confirmT=0;
      clearBtn.textContent='💥 ぜんぶけす';
      sfx('pop');
    }else{
      confirmT=now;
      clearBtn.textContent='ほんとに?';
      setTimeout(function(){clearBtn.textContent='💥 ぜんぶけす';},2500);
    }
  });

  function spawnBall(x,y){
    balls.push({x:x,y:Math.max(y,20),vx:0,vy:0,r:14,hue:HUES[(Math.random()*HUES.length)|0],spin:0});
    if(balls.length>8)balls.shift();
    sfx('pop');
  }
  function hitPart(x,y){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i],d=dims(p.t);
      if(x>=p.x-4&&x<=p.x+d.w+4&&y>=p.y-4&&y<=p.y+d.h+4)return i;
    }
    return -1;
  }
  var snap=function(v){return Math.round(v/8)*8;};
  // 近い高さのパーツに上端をぴったり揃える (橋の段差でボールが止まらないように)
  function magnetY(np){
    for(var i=0;i<parts.length;i++){
      var o=parts[i];
      if(o===np||o.t==='star')continue;
      if(Math.abs(np.y-o.y)<=14){np.y=o.y; return;}
    }
  }

  cv.addEventListener('pointerdown',function(e){
    if(drag&&Date.now()-(drag.tm||0)>1500)drag=null; // 迷子ドラッグの救済
    if(drag)return;
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    var i=hitPart(x,y);
    if(i>=0&&parts[i].locked){
      if(tool==='erase'){sfx('no'); return;} // 固定パーツは消せない
      i=-1; // 固定パーツの上は「なにもない」あつかい
    }
    if(tool==='erase'){
      if(i>=0){parts.splice(i,1); sfx('pop');}
      return;
    }
    if(i>=0){
      var p=parts[i];
      drag={p:p,dx:x-p.x,dy:y-p.y,pid:e.pointerId,tm:Date.now()};
      return;
    }
    if(tool==='ball'){
      // ステージでは きまったスタートちてんから
      if(mode>=0&&spawnPt)spawnBall(spawnPt.x+(Math.random()*10-5),spawnPt.y);
      else spawnBall(x,Math.min(y,H-40));
      return;
    }
    var d=dims(tool);
    var np={t:tool,x:snap(clamp(x-d.w/2,0,W-d.w)),y:snap(clamp(y-d.h/2,0,FLOOR-d.h))};
    magnetY(np);
    parts.push(np);
    drag={p:np,dx:x-np.x,dy:y-np.y,pid:e.pointerId,tm:Date.now()};
    sfx('click');
  });
  window.addEventListener('pointermove',function(e){
    if(cur!=='koro'||!drag||e.pointerId!==drag.pid)return;
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    var d=dims(drag.p.t);
    drag.tm=Date.now();
    drag.p.x=snap(clamp(x-drag.dx,-d.w/2,W-d.w/2));
    drag.p.y=snap(clamp(y-drag.dy,0,FLOOR-d.h+6));
    magnetY(drag.p);
  });
  function endDrag(e){
    if(cur!=='koro'||!drag||e.pointerId!==drag.pid)return;
    drag=null;
  }
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);

  /* --- physics --- */
  function colBox(b,x,y,w,h,rest,fric,tr){
    var cx=clamp(b.x,x,x+w),cy=clamp(b.y,y,y+h);
    var dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
    if(d2>b.r*b.r)return;
    var nx,ny,depth;
    if(d2>0.0001){
      var d=Math.sqrt(d2); nx=dx/d; ny=dy/d; depth=b.r-d;
    }else{
      var l=b.x-x,rt=x+w-b.x,tp=b.y-y,bt=y+h-b.y,m=Math.min(l,rt,tp,bt);
      if(m===tp){nx=0;ny=-1;depth=tp+b.r;}
      else if(m===bt){nx=0;ny=1;depth=bt+b.r;}
      else if(m===l){nx=-1;ny=0;depth=l+b.r;}
      else{nx=1;ny=0;depth=rt+b.r;}
    }
    b.x+=nx*depth; b.y+=ny*depth;
    var vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      if(tr&&ny<-0.6){
        b.vy=-Math.max(Math.abs(b.vy)*1.12,540);
        b.vx+=(Math.random()-0.5)*40;
        sfxThrottle('boing');
        return;
      }
      var tx=-ny,ty=nx;
      var vt=(b.vx*tx+b.vy*ty)*fric;
      var vn2=-vn*rest;
      b.vx=vn2*nx+vt*tx; b.vy=vn2*ny+vt*ty;
      if(vn<-280)sfxThrottle('tak');
    }
  }
  function colSeg(b,x1,y1,x2,y2,rest,fric){
    var ex=x2-x1,ey=y2-y1,L2=ex*ex+ey*ey;
    if(!L2)return;
    var t=clamp(((b.x-x1)*ex+(b.y-y1)*ey)/L2,0,1);
    var cx=x1+ex*t,cy=y1+ey*t;
    var dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
    if(d2>b.r*b.r||d2<0.0001)return;
    var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,depth=b.r-d;
    b.x+=nx*depth; b.y+=ny*depth;
    var vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      var tx=-ny,ty=nx;
      var vt=(b.vx*tx+b.vy*ty)*fric;
      var vn2=-vn*rest;
      b.vx=vn2*nx+vt*tx; b.vy=vn2*ny+vt*ty;
      if(vn<-280)sfxThrottle('tak');
    }
  }
  function collidePart(b,p){
    var d=dims(p.t);
    if(p.t==='block'){colBox(b,p.x,p.y,d.w,d.h,0.3,0.997,false);}
    else if(p.t==='plank'){colBox(b,p.x,p.y,d.w,d.h,0.25,0.997,false);}
    else if(p.t==='tramp'){colBox(b,p.x,p.y,d.w,d.h,0.3,0.997,true);}
    else if(p.t==='goal'){
      colBox(b,p.x,p.y,9,d.h,0.2,0.99,false);
      colBox(b,p.x+d.w-9,p.y,9,d.h,0.2,0.99,false);
      colBox(b,p.x,p.y+d.h-8,d.w,8,0.1,0.9,false);
    }
    else if(p.t==='rampL'){
      colSeg(b,p.x,p.y,p.x+d.w,p.y+d.h,0.15,0.998);
      colSeg(b,p.x,p.y,p.x,p.y+d.h,0.2,0.99);
      colSeg(b,p.x,p.y+d.h,p.x+d.w,p.y+d.h,0.2,0.99);
    }
    else if(p.t==='rampR'){
      colSeg(b,p.x,p.y+d.h,p.x+d.w,p.y,0.15,0.998);
      colSeg(b,p.x+d.w,p.y,p.x+d.w,p.y+d.h,0.2,0.99);
      colSeg(b,p.x,p.y+d.h,p.x+d.w,p.y+d.h,0.2,0.99);
    }
  }
  function step(dt){
    var i,j;
    for(i=0;i<balls.length;i++){
      var b=balls[i];
      b.vy+=1700*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      b.spin+=(b.vx/b.r)*dt;
      if(b.x<b.r){b.x=b.r; b.vx=Math.abs(b.vx)*0.5;}
      if(b.x>W-b.r){b.x=W-b.r; b.vx=-Math.abs(b.vx)*0.5;}
      if(b.y>FLOOR-b.r){
        b.y=FLOOR-b.r;
        if(b.vy>0)b.vy=-b.vy*0.42;
        b.vx*=0.994;
        if(Math.abs(b.vy)<45)b.vy=0;
      }
      for(j=0;j<parts.length;j++)collidePart(b,parts[j]);
    }
    for(i=0;i<balls.length;i++)for(j=i+1;j<balls.length;j++){
      var a=balls[i],c=balls[j];
      var dx=c.x-a.x,dy=c.y-a.y,d2=dx*dx+dy*dy,min=a.r+c.r;
      if(d2<min*min&&d2>0.0001){
        var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(min-d)/2;
        a.x-=nx*ov; a.y-=ny*ov; c.x+=nx*ov; c.y+=ny*ov;
        var rel=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
        if(rel>0){
          var im=rel*0.9;
          a.vx-=im*nx; a.vy-=im*ny; c.vx+=im*nx; c.vy+=im*ny;
        }
      }
    }
    // goals & stars
    var got=false;
    for(j=0;j<parts.length;j++){
      var p=parts[j];
      if(p.t==='goal'){
        var g=dims('goal');
        for(i=0;i<balls.length;i++){
          var bb=balls[i];
          if(bb.x>p.x+13&&bb.x<p.x+g.w-13&&bb.y>p.y+16&&bb.y<p.y+g.h){
            bb.dead=true; got=true; stars++;
            $('#kr-stars').textContent='⭐ '+stars;
            var r=cv.getBoundingClientRect();
            CONF.burst(r.left+bb.x,r.top+p.y,55);
          }
        }
      }else if(p.t==='star'){
        var sx=p.x+26,sy=p.y+26;
        for(i=0;i<balls.length;i++){
          var b3=balls[i];
          var ddx=b3.x-sx,ddy=b3.y-sy;
          if(ddx*ddx+ddy*ddy<42*42){
            b3.dead=true; got=true; stars++;
            $('#kr-stars').textContent='⭐ '+stars;
            var r2=cv.getBoundingClientRect();
            CONF.burst(r2.left+sx,r2.top+sy,55);
          }
        }
      }
    }
    if(got){
      sfx('yay');
      if(mode>=0){
        if(!cleared[mode]){cleared[mode]=true; saveCleared();}
        updateChips();
        $('#kr-ovl-txt').textContent='ステージ'+STAGES[mode].name+' クリア! 🎉';
        $('#kr-next').textContent=(mode<STAGES.length-1)?'つぎの ステージ ▶':'🛠 フリーで あそぶ';
        $('#kr-ovl').classList.remove('hidden');
      }
    }
    balls=balls.filter(function(b2){return !b2.dead;});
  }
  var acc=0;
  function tick(dt){
    acc+=dt;
    var st=1/120,n=0;
    while(acc>st&&n<6){step(st); acc-=st; n++;}
    draw();
  }
  function drawPart(p){
    var d=dims(p.t);
    if(p.t==='block'){
      ctx.fillStyle='#ffb74d'; rr(ctx,p.x,p.y,d.w,d.h,8); ctx.fill();
      ctx.strokeStyle='#ef8f00'; ctx.lineWidth=3; rr(ctx,p.x,p.y,d.w,d.h,8); ctx.stroke();
      ctx.strokeStyle='rgba(239,143,0,.5)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(p.x+6,p.y+d.h/2); ctx.lineTo(p.x+d.w-6,p.y+d.h/2); ctx.stroke();
    }else if(p.t==='plank'){
      ctx.fillStyle='#a1887f'; rr(ctx,p.x,p.y,d.w,d.h,6); ctx.fill();
      ctx.strokeStyle='#6d4c41'; ctx.lineWidth=2; rr(ctx,p.x,p.y,d.w,d.h,6); ctx.stroke();
    }else if(p.t==='tramp'){
      ctx.fillStyle='#f48fb1'; rr(ctx,p.x,p.y,d.w,d.h,10); ctx.fill();
      ctx.strokeStyle='#c2185b'; ctx.lineWidth=2;
      for(var i=1;i<5;i++){
        ctx.beginPath(); ctx.moveTo(p.x+i*d.w/5,p.y+4); ctx.lineTo(p.x+i*d.w/5,p.y+d.h-4); ctx.stroke();
      }
    }else if(p.t==='goal'){
      ctx.fillStyle='#ffd54f';
      ctx.fillRect(p.x,p.y,9,d.h);
      ctx.fillRect(p.x+d.w-9,p.y,9,d.h);
      ctx.fillRect(p.x,p.y+d.h-8,d.w,8);
      ctx.strokeStyle='#f9a825'; ctx.lineWidth=2;
      ctx.strokeRect(p.x,p.y,d.w,d.h);
      ctx.font='22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⭐',p.x+d.w/2,p.y-14);
    }else if(p.t==='star'){
      ctx.font='46px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('⭐',p.x+26,p.y+28);
    }else{
      ctx.fillStyle='#81c784'; ctx.strokeStyle='#388e3c'; ctx.lineWidth=3;
      ctx.beginPath();
      if(p.t==='rampL'){
        ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+d.w,p.y+d.h); ctx.lineTo(p.x,p.y+d.h);
      }else{
        ctx.moveTo(p.x+d.w,p.y); ctx.lineTo(p.x+d.w,p.y+d.h); ctx.lineTo(p.x,p.y+d.h);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  function draw(){
    if(!W)return;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#e8f6ff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#aed581'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
    for(var j=0;j<parts.length;j++){
      drawPart(parts[j]);
      if(parts[j].locked&&parts[j].t!=='star'){
        ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText('🔒',parts[j].x+2,parts[j].y+2);
      }
    }
    for(var i=0;i<balls.length;i++){
      var b=balls[i];
      ctx.save();
      ctx.translate(b.x,b.y); ctx.rotate(b.spin);
      ctx.fillStyle='hsl('+b.hue+',80%,62%)';
      ctx.beginPath(); ctx.arc(0,0,b.r,0,6.29); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(-4,-5,4,0,6.29); ctx.fill();
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(-4,-1,1.8,0,6.29); ctx.arc(4,-1,1.8,0,6.29); ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(0,2,4.5,0.3,2.8); ctx.stroke();
      ctx.restore();
    }
    // ステージのスタートちてん
    if(mode>=0&&spawnPt){
      ctx.setLineDash([5,5]);
      ctx.strokeStyle='#78909c'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(spawnPt.x,spawnPt.y,17,0,6.29); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#78909c';
      ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('スタート',spawnPt.x,spawnPt.y+22);
    }
    ctx.fillStyle='#7a6a55';
    ctx.font='bold 16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    if(mode>=0){
      ctx.fillText('ステージ'+STAGES[mode].name+': '+STAGES[mode].hint,W/2,8);
      if(!balls.length)ctx.fillText('タップすると スタートから ボールがでるよ!',W/2,30);
    }else if(!balls.length){
      ctx.fillText('うえのほうを タップすると ボールがでるよ!',W/2,8);
    }
  }
  return {resize:resize,tick:tick};
})();

/* ================= おえかき ================= */
var OE=(function(){
  var stage=$('#oe-stage'),cv=$('#oe-cv'),ctx=cv.getContext('2d');
  var COLORS=['#37474f','#e53935','#fb8c00','#fdd835','#8bc34a','#00897b','#29b6f6','#3949ab','#8e24aa','#ec407a','#8d6e63','#ffcc80'];
  var SIZEW=[8,20,42],STW=[46,80,124];
  var EMOJIS='🐶🐱🐭🐰🦊🐻🐼🐸🐵🐥🦁🐮🐷🐨🦄🐟🐬🐙🦋🐞🦖🦕🌸🌷🌻🍀🌈⭐🌙☀️☁️⛄❄️🔥🍎🍌🍓🍉🍦🍩🍰🍭🚗🚌🚒🚂✈️🚀⛵⚽🏀🎈🎁🎀🎵🎹🥁👑💎💖✨😀😆😍😺🤖👻';
  var W=0,H=0,tool='pen',color=COLORS[1],size=1,stampCh='🐶',undoStack=[],strokes={},nStrokes=0,inited=false,confirmT=0;

  function resize(){
    var nw=stage.clientWidth,nh=stage.clientHeight;
    if(!nw||!nh)return;
    if(inited&&nw===W&&nh===H)return;
    var tmp=null;
    if(inited){
      tmp=document.createElement('canvas');
      tmp.width=cv.width; tmp.height=cv.height;
      tmp.getContext('2d').drawImage(cv,0,0);
    }
    W=nw; H=nh;
    var d=Math.min(window.devicePixelRatio||1,2);
    cv.width=W*d; cv.height=H*d;
    ctx.setTransform(d,0,0,d,0,0);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    if(tmp)ctx.drawImage(tmp,0,0,W,H);
    inited=true;
  }
  function pushUndo(){
    if(undoStack.length>=10)undoStack.shift();
    try{undoStack.push(cv.toDataURL());}catch(e){}
  }
  function getPos(e){
    var r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function doStamp(p){
    ctx.font=STW[size]+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(stampCh,p.x,p.y);
  }
  function dot(p){
    ctx.fillStyle=(tool==='eraser')?'#fff':color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,(tool==='eraser'?SIZEW[size]:SIZEW[size]/2),0,6.29);
    ctx.fill();
  }
  cv.addEventListener('pointerdown',function(e){
    var p=getPos(e);
    if(nStrokes===0)pushUndo();
    var st={x:p.x,y:p.y,acc:0,hue:Math.random()*360};
    strokes[e.pointerId]=st; nStrokes++;
    if(tool==='stamp'){doStamp(p); sfx('pop');}
    else if(tool!=='rainbow')dot(p);
  });
  window.addEventListener('pointermove',function(e){
    if(cur!=='oekaki')return;
    var st=strokes[e.pointerId];
    if(!st)return;
    var p=getPos(e);
    if(tool==='stamp'){
      var dx=p.x-st.x,dy=p.y-st.y;
      st.acc+=Math.sqrt(dx*dx+dy*dy);
      if(st.acc>STW[size]*0.85){doStamp(p); st.acc=0;}
    }else{
      ctx.lineCap='round'; ctx.lineJoin='round';
      if(tool==='rainbow'){
        st.hue=(st.hue+6)%360;
        ctx.strokeStyle='hsl('+st.hue+',90%,55%)';
        ctx.lineWidth=SIZEW[size]*1.2;
      }else if(tool==='eraser'){
        ctx.strokeStyle='#fff'; ctx.lineWidth=SIZEW[size]*2;
      }else{
        ctx.strokeStyle=color; ctx.lineWidth=SIZEW[size];
      }
      ctx.beginPath(); ctx.moveTo(st.x,st.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    }
    st.x=p.x; st.y=p.y;
  });
  function endStroke(e){
    if(strokes[e.pointerId]){delete strokes[e.pointerId]; nStrokes=Math.max(0,nStrokes-1);}
  }
  window.addEventListener('pointerup',endStroke);
  window.addEventListener('pointercancel',endStroke);

  // toolbar
  var bar=$('#oe-tools');
  function mkTool(id,ico,lbl){
    var b=document.createElement('button');
    b.className='tbtn'+(id===tool?' sel':'');
    b.innerHTML='<span class="ico">'+ico+'</span>'+lbl;
    b.dataset.tool=id;
    b.addEventListener('click',function(){
      sfx('click');
      if(id==='stamp'){
        $('#oe-drawer').classList.toggle('hidden');
        if(tool!=='stamp')setTool('stamp');
        return;
      }
      $('#oe-drawer').classList.add('hidden');
      setTool(id);
    });

var UT=(function(){

    {name:'よろこびのうた',emo:'😊',bpm:126,wave:'triangle',notes:[[76,1],[76,1],[77,1],[79,1],[79,1],[77,1],[76,1],[74,1],[72,1],[72,1],[74,1],[76,1],[76,1.5],[74,0.5],[74,2],[76,1],[76,1],[77,1],[79,1],[79,1],[77,1],[76,1],[74,1],[72,1],[72,1],[74,1],[76,1],[74,1.5],[72,0.5],[72,2]]},

  function fmt(s){

  function stopAll(){
    if(playing){
      try{if(playing.src)playing.src.stop();}catch(e){}
      try{if(playing.master)playing.master.disconnect();}catch(e){}

    }
    stateEl.textContent='マイクの じゅんびちゅう…';
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s;
      var opt=null;
      try{
        if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4'))opt={mimeType:'audio/mp4'};
        else if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))opt={mimeType:'audio/webm'};
      }catch(e){}
      chunks=[];
      rec=opt?new MediaRecorder(s,opt):new MediaRecorder(s);
      rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
      rec.onstop=onStop;
      rec.start();
      recT0=Date.now();
      recBtn.textContent='⏹';

  function stopRec(){

    try{if(rec&&rec.state!=='inactive')rec.stop();}catch(e){}
  }
  function onStop(){
    var mime=(rec&&rec.mimeType)||'audio/mp4';
    var blob=new Blob(chunks,{type:mime});
    var dur=(Date.now()-recT0)/1000;
    if(stream){stream.getTracks().forEach(function(t){t.stop();}); stream=null;}
    rec=null;
    recBtn.textContent='🔴';
    recBtn.classList.remove('recording');
    timeEl.textContent='';
    if(dur<0.4||!blob.size){stateEl.textContent='みじかすぎたみたい… もういちど!'; return;}
    var take={name:'テイク'+(takeNo++),dur:dur,url:URL.createObjectURL(blob),buffer:null};
    blob.arrayBuffer().then(function(ab){
      return new Promise(function(res,rej){ac().decodeAudioData(ab,res,rej);});
    }).then(function(buf){take.buffer=buf;}).catch(function(){});
    takes.push(take);
    if(takes.length>10){var old=takes.shift(); URL.revokeObjectURL(old.url);}
    sel=takes.length-1;

  function play(fx){
    if(sel<0||!takes[sel]){stateEl.textContent='さきに ろくおんしてね!'; return;}
    var t=takes[sel];
    stopAll();
    if(t.buffer){
      var c=ac();
      var master=c.createGain(); master.gain.value=0.95; master.connect(c.destination);
      var src=c.createBufferSource(); src.buffer=t.buffer;
      src.playbackRate.value=fx.rate;
      var node=src,extra=[];
      if(fx.ring){
        var vca=c.createGain(); vca.gain.value=0;
        var o=c.createOscillator(); o.frequency.value=30;
        o.connect(vca.gain); o.start(); extra.push(o);
        node.connect(vca); node=vca;
      }
      node.connect(master);
      if(fx.echo){
        var dl=c.createDelay(1); dl.delayTime.value=0.26;
        var fb=c.createGain(); fb.gain.value=0.45;
        node.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(master);
      }
      src.start();
      playing={src:src,master:master,extra:extra};
      src.onended=function(){if(playing&&playing.src===src)playing=null;};
    }else{
      // fallback: <audio> element (rate change = speed+pitch)
      var a=new Audio(t.url);
      a.playbackRate=fx.rate;
      try{a.preservesPitch=false; a.webkitPreservesPitch=false;}catch(e){}
      a.play();
      playing={el:a};
    }
  }
  // fx buttons
  var row=$('#fx-row');
  FXS.forEach(function(fx){
    var b=document.createElement('button');
    b.className='fxbtn';

  row.appendChild(stopB);
  /* --- jukebox --- */
  function playSong(s,btn){
    stopAll();
    var c=ac();
    var master=c.createGain(); master.gain.value=0.6; master.connect(c.destination);
    var t=c.currentTime+0.15,t0=t;
    var g=s.gate||0.9;
    var peak=s.wave==='square'?0.18:0.3;
    for(var i=0;i<s.notes.length;i++){
      var m=s.notes[i][0],beats=s.notes[i][1];
      var d=beats*60/s.bpm;
      if(m){
        var o=c.createOscillator();
        o.type=s.wave||'triangle';
        o.frequency.value=440*Math.pow(2,(m-69)/12);
        var eg=c.createGain();
        eg.gain.setValueAtTime(0.0001,t);
        eg.gain.exponentialRampToValueAtTime(peak,t+0.015);
        eg.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.06,d*g));
        o.connect(eg); eg.connect(master);
        o.start(t); o.stop(t+d*g+0.06);
      }
      t+=d;
    }
    songPlaying={master:master,btn:btn,timer:setTimeout(stopSong,(t-t0)*1000+400)};
    btn.classList.add('playing');
  }
  function stopSong(){
    if(!songPlaying)return;
    clearTimeout(songPlaying.timer);
    try{songPlaying.master.disconnect();}catch(e){}
    songPlaying.btn.classList.remove('playing');
    songPlaying=null;
  }

      sfx('click'); playSong(s,b);
    });
    sBox.appendChild(b);
  });
  return {stopAll:stopAll};
})();

var KS=(function(){
  var MODES=[
    {id:'add',s:'＋'},{id:'sub',s:'−'},{id:'mul',s:'×'},{id:'div',s:'÷'},{id:'mix',s:'ミックス'}
  ];
  var mode='add',score=0,cur=null,answered=false;
  try{score=parseInt(localStorage.getItem('asobi-keisan')||'0',10)||0;}catch(e){}
  function saveScore(){try{localStorage.setItem('asobi-keisan',''+score);}catch(e){}}
  function updScore(){$('#ks-score').textContent='⭐ '+score;}
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}

  // モード切りかえチップ
  var mBox=$('#ks-modes');
  MODES.forEach(function(m,idx){
    var b=document.createElement('button');
    b.className='stagechip'+(idx===0?' sel':'');
    b.textContent=m.s;
    b.addEventListener('click',function(){
      sfx('click'); mode=m.id;
      $$('#ks-modes .stagechip').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
      gen();
    });
    mBox.appendChild(b);
  });

  function gen(){
    var m=(mode==='mix')?['add','sub','mul','div'][ri(0,3)]:mode;
    var a,b,ans,sym;
    if(m==='add'){a=ri(1,10); b=ri(1,10); ans=a+b; sym='＋';}
    else if(m==='sub'){a=ri(2,15); b=ri(1,a); ans=a-b; sym='−';}
    else if(m==='mul'){a=ri(1,9); b=ri(1,9); ans=a*b; sym='×';}
    else{b=ri(2,9); ans=ri(1,9); a=b*ans; sym='÷';}
    cur={m:m,a:a,b:b,ans:ans};
    answered=false;
    $('#ks-problem').textContent=a+' '+sym+' '+b+' = ?';
    $('#ks-visual').innerHTML='';
    // 4たくの選択肢 (正解+まぎらわしい数)
    var set=[ans],tries=0;
    while(set.length<4&&tries<80){
      tries++;
      var d;
      if(m==='mul'&&Math.random()<0.5){d=Math.max(0,(a+ri(-1,1))*(b+ri(-1,1)));}
      else{d=ans+[-2,-1,1,2,ri(-4,4),b,-b][ri(0,6)];}
      if(d<0||d===ans||set.indexOf(d)>=0)continue;
      set.push(d);
    }
    var pad=1;
    while(set.length<4){
      if(set.indexOf(ans+pad)<0)set.push(ans+pad);
      pad++;
    }
    set.sort(function(){return Math.random()-0.5;});
    var box=$('#ks-answers');
    box.innerHTML='';
    set.forEach(function(v){
      var b2=document.createElement('button');
      b2.className='ksbtn';
      b2.textContent=v;
      b2.addEventListener('click',function(){pick(b2,v);});
      box.appendChild(b2);
    });
  }
  function pick(btn,v){
    if(answered)return;
    if(v===cur.ans){
      answered=true;
      btn.classList.add('ok');
      score++; updScore(); saveScore();
      var r=$('#ks-problem').getBoundingClientRect();
      if(score%5===0){sfx('yay'); CONF.burst(r.left+r.width/2,r.top+r.height/2,80);}
      else{sfx('star'); CONF.burst(r.left+r.width/2,r.top+r.height/2,26);}
      setTimeout(gen,900);
    }else{
      btn.classList.add('ng');
      btn.disabled=true;
      sfx('no');
    }
  }
  // ヒント: ブロックの絵で見せる
  $('#ks-hint').addEventListener('click',function(){
    if(!cur)return;
    sfx('click');
    var v=$('#ks-visual');
    v.innerHTML='';
    function sq(color,size,dim){
      var s=document.createElement('span');
      s.className='ks-sq';
      s.style.background=color;
      if(size){s.style.width=size+'px'; s.style.height=size+'px';}
      if(dim)s.style.opacity='0.3';
      return s;
    }
    var i,j;
    if(cur.m==='add'){
      for(i=0;i<cur.a;i++)v.appendChild(sq('#ef5350'));
      for(i=0;i<cur.b;i++)v.appendChild(sq('#42a5f5'));
    }else if(cur.m==='sub'){
      for(i=0;i<cur.a;i++)v.appendChild(sq('#ef5350',null,i>=cur.a-cur.b));
    }else if(cur.m==='mul'){
      for(i=0;i<cur.b;i++){
        var row=document.createElement('span');
        row.className='ks-row';
        for(j=0;j<cur.a;j++)row.appendChild(sq('#66bb6a',16));
        v.appendChild(row);
      }
    }else{
      for(i=0;i<cur.ans;i++){
        var grp=document.createElement('span');
        grp.className='ks-grp';
        for(j=0;j<cur.b;j++)grp.appendChild(sq('#ab47bc',16));
        v.appendChild(grp);
      }
    }
  });
  updScore();
  return {enter:function(){gen();}};
})();

var GP=(function(){
  var curEl=$('#gp-cursor');
  var on=false,x=window.innerWidth/2,y=window.innerHeight/2,down=false;
  window.addEventListener('gamepadconnected',function(){on=true; curEl.style.display='block'; move(0,0);});
  window.addEventListener('gamepaddisconnected',function(){
    if(!scan()){on=false; curEl.style.display='none';}
  });
  function scan(){
    if(!navigator.getGamepads)return null;
    var gs=navigator.getGamepads();
    for(var i=0;i<gs.length;i++)if(gs[i]&&gs[i].connected)return gs[i];
    return null;
  }
  function dead(v){return Math.abs(v)<0.18?0:v;}
  function move(dx,dy){
    x=clamp(x+dx,0,window.innerWidth-1);
    y=clamp(y+dy,0,window.innerHeight-1);
    curEl.style.transform='translate('+(x-17)+'px,'+(y-17)+'px)';
  }
  function fire(type){
    var el=document.elementFromPoint(x,y)||document.body;
    var init={bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:7777,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1};
    var ev;
    try{ev=new PointerEvent(type,init);}
    catch(e){ev=new MouseEvent(type.replace('pointer','mouse'),init);}
    el.dispatchEvent(ev);
    return el;
  }
  function pressed(p,i){return p.buttons[i]&&p.buttons[i].pressed;}
  function tick(){
    if(!on)return;
    var p=scan();
    if(!p)return;
    var dx=dead(p.axes[0]||0),dy=dead(p.axes[1]||0);
    if(pressed(p,14))dx-=1;
    if(pressed(p,15))dx+=1;
    if(pressed(p,12))dy-=1;
    if(pressed(p,13))dy+=1;
    var moved=false;
    if(dx||dy){move(dx*11,dy*11); moved=true;}
    var pr=pressed(p,0)||pressed(p,1)||pressed(p,2)||pressed(p,3);
    if(pr&&!down){down=true; curEl.classList.add('down'); fire('pointerdown');}
    else if(!pr&&down){
      down=false; curEl.classList.remove('down');
      fire('pointerup');
      var el=document.elementFromPoint(x,y);
      if(el){
        try{el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,clientX:x,clientY:y}));}catch(e){}
      }
    }
    else if(pr&&moved){fire('pointermove');}
  }
  return {tick:tick};
})();

var lastT=0;
function raf(ts){
  var dt=Math.min(0.033,(ts-lastT)/1000)||0.016;
  lastT=ts;
  GP.tick();
  if(cur==='koro')KR.tick(dt);
  else if(cur==='kazu')KZ.tick(dt);
  CONF.tick(dt);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
</script>
