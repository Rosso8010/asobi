<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ミニゲーム・プレビュー</title><style>body{margin:0;background:#102738;color:#fff0cd;font:16px/1.7 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:18px}h1{font-size:26px;margin:5px 0}header{display:flex;align-items:center;gap:15px;flex-wrap:wrap}select,button,a{min-height:44px;padding:10px;border:1px solid #d3b970;border-radius:12px;background:#244758;color:#fff0cd;font:inherit}select{max-width:100%;flex:1}iframe{display:block;width:100%;height:min(76vh,820px);min-height:440px;border:3px solid #d5bc76;border-radius:18px;background:#fff;margin-top:16px}p{font-size:13px;color:#d7decd}a{text-decoration:none;display:inline-block}.nav{display:flex;gap:10px;flex-wrap:wrap}</style><main><header><h1>MINIGAME PREVIEW</h1><a href="index.html">遊びの国へ</a></header><p>本番と同じゲームを実際に遊べます。獲得した星と履歴は、このプレビューを開いた環境に保存されます。</p><div class="nav"><select id="games" aria-label="プレビューするゲーム"><option>ゲームを読み込み中…</option></select><button id="random">🎲 おまかせ</button><button id="again">↻ もう一度</button></div><iframe id="play" title="遊べるミニゲーム" src="index.html?previewGame=rush:0" allow="autoplay"></iframe><p id="info"></p></main><script>var frame=document.getElementById('play'),select=document.getElementById('games'),games=[];function start(key){var target=new URLSearchParams(location.search).get('clockTarget');frame.src='index.html?previewGame='+encodeURIComponent(key)+(target?'&clockTarget='+encodeURIComponent(target):'');}frame.onload=function(){try{games=frame.contentWindow.QUEST.catalogue();var selected=new URL(frame.src).searchParams.get('previewGame');select.innerHTML='';games.forEach(function(game){var o=document.createElement('option');o.value=game.key;o.textContent=game.name;select.appendChild(o);});select.value=selected;document.getElementById('info').textContent=games.length+'種類から選べます。ゲーム中は一時停止できます。';}catch(e){document.getElementById('info').textContent='ブラウザでプレビューを開けない場合は、アプリと同じサーバーまたはGitHub Pagesから開いてください。';}};var initialGame=new URLSearchParams(location.search).get('game');if(initialGame&&/^(rush|brain|adventure|math|stop|find|map):\d+$/.test(initialGame))start(initialGame);select.onchange=function(){start(select.value);};document.getElementById('random').onclick=function(){if(games.length)start(games[Math.floor(Math.random()*games.length)].key);};document.getElementById('again').onclick=function(){start(select.value);};</script></html>
